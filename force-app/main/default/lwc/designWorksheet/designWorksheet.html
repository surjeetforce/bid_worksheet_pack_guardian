<template>

        <div class={designContainerClass}>

                <!-- Loading Spinner -->
                <template if:true={isLoading}>
                        <div class="slds-align_absolute-center" style="height: 200px;">
                                <lightning-spinner alternative-text="Loading Design Worksheet..." size="medium"
                                        variant="brand">
                                </lightning-spinner>
                                <p class="slds-m-top_medium slds-text-body_regular">
                                        Loading design data...
                                </p>
                        </div>
                </template>

                <!-- Form Content -->
                <template if:false={isLoading}>

                        <!-- Sheet Header -->
                        <div class="sheet-header">
                                <span class="sheet-title">DESIGN NARRATIVE</span>
                                <div class="header-actions">
                                        <span class="sheet-date">{currentDate}</span>
                                        <lightning-button label="Download CSV" icon-name="utility:download" variant="brand-outline" 
                                                onclick={handleDownloadCSV} class="slds-m-left_medium">
                                        </lightning-button>
                                </div>
                        </div>

                        <!-- Simple input fields -->
                        <div class="simple-field">
                                <lightning-input label="Job Name" value={formData.jobName} onchange={handleInputChange}
                                        data-field="jobName" disabled={isReadOnly}></lightning-input>
                        </div>

                        <div class="simple-field">
                                <lightning-input label="JOB ADDRESS" value={formData.jobAddress}
                                        onchange={handleInputChange} data-field="jobAddress" disabled={isReadOnly}></lightning-input>
                        </div>

                        <div class="simple-field">
                                <lightning-input label="DESCRIPTION" value={formData.description}
                                        onchange={handleInputChange} data-field="description" disabled={isReadOnly}></lightning-input>
                        </div>

                        <!-- Table format - 10 COLUMNS TOTAL -->
                        <table class="excel-table">
                                <tbody>
                                        <!-- Service Territory -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_serviceTerritory} data-field="label_serviceTerritory" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="serviceTerritory_SC"
                                                                        checked={formData.serviceTerritory_SC}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td class="text-col">SC</td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="serviceTerritory_NC"
                                                                        checked={formData.serviceTerritory_NC}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td class="text-col">NC</td>
                                                <td class="input-col" colspan="2">
                                                        <lightning-input type="number" label="#FLOORS"
                                                                value={formData.numberOfFloors}
                                                                onchange={handleInputChange} data-field="numberOfFloors"
                                                                data-is-allowed-decimal="false"
                                                                onkeydown={handleKeyDown} disabled={isReadOnly}></lightning-input>
                                                </td>
                                                <td class="input-col" colspan="3">
                                                        <lightning-input label="PENTHOUSE" value={formData.penthouse}
                                                                onchange={handleInputChange} data-field="penthouse" disabled={isReadOnly}>
                                                        </lightning-input>
                                                </td>
                                        </tr>

                                        <!-- Bid Plan Date -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_bidPlanDate} data-field="label_bidPlanDate" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td colspan="9">
                                                        <lightning-input type="date" value={formData.bidPlanDate}
                                                                onchange={handleInputChange} data-field="bidPlanDate" disabled={isReadOnly}>
                                                        </lightning-input>
                                                </td>
                                        </tr>

                                        <!-- Residential Rates -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_residentialRates} data-field="label_residentialRates" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="residentialRates"
                                                                        checked={formData.residentialRates}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td colspan="8">&nbsp;</td>
                                        </tr>

                                        <!-- Local Hire -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_localHire} data-field="label_localHire" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="localHire"
                                                                        checked={formData.localHire}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td colspan="8">&nbsp;</td>
                                        </tr>

                                        <!-- Apprentice % -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_apprenticePercent} data-field="label_apprenticePercent" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="apprenticePercent"
                                                                        checked={formData.apprenticePercent}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td colspan="8">&nbsp;</td>
                                        </tr>

                                        <!-- Textura -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_textura} data-field="label_textura" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="textura"
                                                                        checked={formData.textura}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td colspan="8">&nbsp;</td>
                                        </tr>

                                        <!-- Certified Payroll -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_certifiedPayroll} data-field="label_certifiedPayroll" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="certifiedPayroll"
                                                                        checked={formData.certifiedPayroll}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td colspan="8">&nbsp;</td>
                                        </tr>

                                        <!-- Bond -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_bond} data-field="label_bond" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="bond"
                                                                        checked={formData.bond}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td colspan="8">&nbsp;</td>
                                        </tr>

                                        <!-- OCIP -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_ocip} data-field="label_ocip" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="ocipDeduct"
                                                                        checked={formData.ocipDeduct}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td class="text-col" colspan="2">DEDUCT</td>
                                                <td colspan="5">
                                                        <lightning-input type="number" label="$ AMOUNT"
                                                                value={formData.ocupAmount} onchange={handleInputChange}
                                                                data-field="ocupAmount" data-is-allowed-decimal="true"
                                                                onkeydown={handleKeyDown} step="0.01" disabled={isReadOnly}></lightning-input>
                                                </td>
                                        </tr>

                                        <!-- Market Recovery -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_marketRecovery} data-field="label_marketRecovery" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="marketRecovery"
                                                                        checked={formData.marketRecovery}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td colspan="8">&nbsp;</td>
                                        </tr>

                                        <!-- BIM Required -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_bimRequired} data-field="label_bimRequired" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="bimRequired"
                                                                        checked={formData.bimRequired}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td colspan="8">&nbsp;</td>
                                        </tr>

                                        <!-- Permit Fees -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_permitFees} data-field="label_permitFees" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="permitFeesIncluded"
                                                                        checked={formData.permitFeesIncluded}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td class="text-col" colspan="2">INCLUDED</td>
                                                <td colspan="5">
                                                        <lightning-input type="number" label="$ AMOUNT"
                                                                value={formData.permitAmount}
                                                                onchange={handleInputChange} data-field="permitAmount"
                                                                data-is-allowed-decimal="true" onkeydown={handleKeyDown}

                                                        </lightning-input>
                                                </td>
                                        </tr>

                                        <!-- AMMR -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_ammr} data-field="label_ammr" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td colspan="9">
                                                        <lightning-input value={formData.ammr}
                                                                onchange={handleInputChange} data-field="ammr" disabled={isReadOnly}>
                                                        </lightning-input>
                                                </td>
                                        </tr>

                                        <!-- PRE APP -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_preApp} data-field="label_preApp" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td colspan="9">
                                                        <lightning-input value={formData.preApp}
                                                                onchange={handleInputChange} data-field="preApp" disabled={isReadOnly}>
                                                        </lightning-input>
                                                </td>
                                        </tr>

                                        <!-- FPE REQUIRED -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_fpeRequired} data-field="label_fpeRequired" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td colspan="9">
                                                        <lightning-input value={formData.fpeRequired}
                                                                onchange={handleInputChange} data-field="fpeRequired" disabled={isReadOnly}>
                                                        </lightning-input>
                                                </td>
                                        </tr>

                                        <!-- AHJ -->
                                        <tr class="section-light-blue">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_ahj} data-field="label_ahj" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td colspan="9">
                                                        <lightning-input value={formData.ahj}
                                                                onchange={handleInputChange} data-field="ahj" disabled={isReadOnly}>
                                                        </lightning-input>
                                                </td>
                                        </tr>

                                        <!-- System Design Section - Pink -->
                                        <tr class="section-pink">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_hazardClassification} data-field="label_hazardClassification" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td colspan="3">
                                                        <lightning-input value={formData.hazardClassification}
                                                                onchange={handleInputChange}
                                                                data-field="hazardClassification" disabled={isReadOnly}>
                                                        </lightning-input>
                                                </td>
                                                <td class="label-col" colspan="2">
                                                        <input type="text" value={formData.label_densityRequired} data-field="label_densityRequired" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="densityRequired"
                                                                        checked={formData.densityRequired}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td colspan="3">&nbsp;</td>
                                        </tr>

                                        <tr class="section-pink">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_atticSprinklers} data-field="label_atticSprinklers" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="atticSprinklersRequired"
                                                                        checked={formData.atticSprinklersRequired}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td colspan="8">&nbsp;</td>
                                        </tr>

                                        <tr class="section-pink">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_headTypes} data-field="label_headTypes" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td colspan="2">ATTIC
                                                        HEADS</td>
                                                <td colspan="2">
                                                        <lightning-input value={formData.headTypesAttic}
                                                                onchange={handleInputChange}
                                                                data-field="headTypesAttic" disabled={isReadOnly}></lightning-input>
                                                </td>
                                                <td colspan="2">CEILING
                                                        HEADS</td>
                                                <td colspan="3">
                                                        <lightning-input value={formData.headTypesCeiling}
                                                                onchange={handleInputChange}
                                                                data-field="headTypesCeiling" disabled={isReadOnly}></lightning-input>
                                                </td>
                                        </tr>

                                        <tr class="section-pink">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_standpipeQty} data-field="label_standpipeQty" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td colspan="9">
                                                        <lightning-input value={formData.standpipeQty}
                                                                onchange={handleInputChange} data-field="standpipeQty" disabled={isReadOnly}>
                                                        </lightning-input>
                                                </td>
                                        </tr>

                                        <tr class="section-pink">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_tempSpRequired} data-field="label_tempSpRequired" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="tempSpRequired"
                                                                        checked={formData.tempSpRequired}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td colspan="8">&nbsp;</td>
                                        </tr>

                                        <tr class="section-pink">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_firePump} data-field="label_firePump" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="text-col">GPM</td>
                                                <td class="input-col">
                                                        <lightning-input value={formData.firePumpGpm} onchange={handleInputChange} data-field="firePumpGpm" disabled={isReadOnly}></lightning-input>
                                                </td>
                                                <td class="text-col">PSI</td>
                                                <td class="input-col">
                                                        <lightning-input value={formData.firePumpPsi} onchange={handleInputChange} data-field="firePumpPsi" disabled={isReadOnly}></lightning-input>
                                                </td>
                                                <td class="text-col">VOLTAGE</td>
                                                <td class="input-col">
                                                        <lightning-input value={formData.firePumpVoltage} onchange={handleInputChange} data-field="firePumpVoltage" disabled={isReadOnly}></lightning-input>
                                                </td>
                                                <td class="text-col">TRANSFER SWITCH</td>
                                                <td class="input-col">
                                                        <lightning-input value={formData.firePumpTransferSwitch} onchange={handleInputChange} data-field="firePumpTransferSwitch" disabled={isReadOnly}></lightning-input>
                                                </td>
                                        </tr>

                                        <!-- Materials -->
                                        <tr class="section-pink">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_buyAmerican} data-field="label_buyAmerican" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="buyAmerican"
                                                                        checked={formData.buyAmerican}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td colspan="8">&nbsp;</td>
                                        </tr>

                                        <tr class="section-pink">

                                                        <input type="text" value={formData.label_steelPipe} data-field="label_steelPipe" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />

                                        <tr class="section-pink">

                                        <tr class="section-pink">

                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="dynaflow"
                                                                        checked={formData.dynaflow}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td colspan="8">&nbsp;</td>

                                        <tr class="section-pink">

                                                </td>
                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
                                                                        data-field="cpvc"
                                                                        checked={formData.cpvc}
                                                                        onchange={handleCheckboxChange} disabled={isReadOnly} /></td>
                                                <td colspan="8">&nbsp;</td>
                                        </tr>

                                        <!-- Green Section - Head Details -->
                                        <tr class="section-green">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_ceilingHeads} data-field="label_ceilingHeads" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td colspan="9">

                                                        </lightning-input>

                                        <tr class="section-green">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_atticHeads} data-field="label_atticHeads" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />
                                                </td>
                                                <td colspan="9">
                                                        <lightning-input type="number" value={formData.atticHeads}

                                        <tr class="section-green">

                                                </td>
                                                <td colspan="2">CEILING</td>
                                                <td colspan="2">
                                                        <lightning-input value={formData.headTypeColorCeiling}
                                                                onchange={handleInputChange}
                                                                data-field="headTypeColorCeiling" disabled={isReadOnly}>
                                                        </lightning-input>

                                        <tr class="section-green">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_metraflexLoops} data-field="label_metraflexLoops" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />

                                        <tr class="section-green">
                                                <td class="label-col">
                                                        <input type="text" value={formData.label_flexheads} data-field="label_flexheads" oninput={handleInputChange} class="label-input" disabled={isReadOnly} />

                                                <td colspan="9">
                                                        <lightning-input type="number" value={formData.fdcCount}

                                                <td class="checkbox-col"><input
                                                                        type="checkbox"
