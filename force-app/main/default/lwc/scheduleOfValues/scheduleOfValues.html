<template>
    <div class="slds-p-around_medium">
        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-p-around_x-large slds-text-align_center">
                <lightning-spinner alternative-text="Loading Schedule of Values..." size="medium" variant="brand">
                </lightning-spinner>
                <p class="slds-m-top_medium slds-text-body_regular">
                    Loading schedule data...
                </p>
            </div>
        </template>

        <template if:false={isLoading}>
            <!-- Sheet Header (matches other worksheets) -->
            <div class="sheet-header">
                <span class="sheet-title">SCHEDULE OF VALUES</span>
                <div class="header-actions">
                    <span class="sheet-date">{currentDate}</span>
                    <lightning-button label="Download CSV" icon-name="utility:download" variant="brand-outline" 
                        onclick={handleDownloadCSV} class="slds-m-left_medium">
                    </lightning-button>
                </div>
            </div>

            <div class={sovBodyClass}>
                <!-- Job Summary Section -->
                <section class="job-summary-section">
                    <table class="job-summary-table">
                        <tbody>
                            <tr>
                                <th>JOB NAME :</th>
                                <td colspan="4">
                                    <input
                                            class="field-input"
                                            type="text"
                                            value={jobOverview.jobName}
                                            data-field="jobName"
                                            oninput={handleJobInfoChange}
                                            disabled={isReadOnly}
                                        />
                                </td>
                                <th># OF BUILDINGS :</th>
                                <td class="narrow-cell">
                                    <input
                                            class="field-input align-center"
                                            type="text"
                                            inputmode="numeric"
                                            value={jobOverview.numberOfBuildings}
                                            data-field="numberOfBuildings"
                                            oninput={handleJobInfoChange}
                                            onblur={handleJobInfoBlur}
                                            disabled={isReadOnly}
                                        />
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>

                <!-- Summary Section - All Buildings -->
                <section class="summary-section">
                    <div class="summary-table-wrapper">
                        <table class="summary-table">
                            <thead>
                                <tr>
                                    <th style="width: 25%;">ALL BUILDINGS</th>
                                    <th class="amount-column">TOTAL</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={summaryRows} for:item="row">
                                    <tr key={row.id}>
                                        <td class="description-cell">
                                            <input
                                                    type="text"
                                                    value={row.label}
                                                    data-row-id={row.id}
                                                    oninput={handleSummaryLabelChange}
                                                    disabled={isReadOnly}
                                                />
                                        </td>
                                        <td class={row.cellClass}>
                                            <div class="amount-editor">
                                                <template if:true={row.isReadonly}>
                                                    <span class="readonly-value">{row.displayValue}</span>
                                                </template>
                                                <template if:false={row.isReadonly}>
                                                    <input
                                                            type="text"
                                                            inputmode="decimal"
                                                            value={row.value}
                                                            data-row-id={row.id}
                                                            oninput={handleSummaryValueChange}
                                                            onblur={handleBlur}
                                                            disabled={isReadOnly}
                                                        />
                                                </template>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                                <tr class="grand-total-row">
                                    <th>TOTAL FROM ALL BUILDINGS</th>
                                    <th class="grand-total-value readonly-cell">{totalSummaryDisplay}</th>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Individual Building Sections -->
                <template for:each={visibleBuildings} for:item="building">
                    <section key={building.id} class="building-section">
                        <div class="building-header">
                            <div class="building-label">
                                <span class="label">BUILDING #</span>
                                <span class="value">{building.label}</span>
                            </div>
                        </div>

                        <div class="building-table-wrapper">
                            <table class="building-table">
                                <thead>
                                    <tr>
                                        <th style="width: 25%;">BUILDING #{building.label}</th>
                                        <template for:each={floorColumns} for:item="column">
                                            <th key={column.key}>{column.label}</th>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={building.categoryRows} for:item="row">
                                        <tr key={row.id}>
                                            <td class="description-cell">
                                                <input
                                                        type="text"
                                                        value={row.label}
                                                        data-building-id={building.id}
                                                        data-row-id={row.id}
                                                        oninput={handleBuildingLabelChange}
                                                        disabled={isReadOnly}
                                                    />
                                            </td>
                                            <template for:each={row.cells} for:item="cell">
                                                <td key={cell.key} class={cell.cellClass}>
                                                    <template if:true={cell.isTotal}>
                                                        <span class="readonly-value">{cell.displayValue}</span>
                                                    </template>
                                                    <template if:false={cell.isTotal}>
                                                        <input
                                                                type="text"
                                                                inputmode="decimal"
                                                                value={cell.value}
                                                                data-building-id={building.id}
                                                                data-row-id={row.id}
                                                                data-floor-key={cell.key}
                                                                oninput={handleBuildingValueChange}
                                                                onblur={handleBlur}
                                                                disabled={isReadOnly}
                                                            />
                                                    </template>
                                                </td>
                                            </template>
                                        </tr>
                                    </template>
                                    <tr class="building-total-row">
                                        <th>TOTAL BUILDING #{building.label}</th>
                                        <template for:each={building.floorSummaryCells} for:item="cell">
                                            <td key={cell.key} class="readonly-cell">
                                                <span class="readonly-value">{cell.displayValue}</span>
                                            </td>
                                        </template>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </template>

                <!-- Save button removed - handled by parent -->
            </div>
        </template>
    </div>
</template>
